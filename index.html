<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2D Field Log</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        #syncStatus {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #3d6b4f;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            z-index: 10000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="syncStatus">Syncing...</div>
    <h1>D2D Field Log 2.0</h1>
    <p>This is your field logging app with offline support and background sync.</p>
    <!-- Your existing app content goes here -->

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(reg => {
      console.log('✅ Service Worker registered successfully');
    })
    .catch(err => console.error('❌ SW registration failed:', err));
}

// Listen for messages from service worker
navigator.serviceWorker.addEventListener('message', event => {
  const statusEl = document.getElementById('syncStatus');
  if (event.data && event.data.type === 'SYNC_START') {
    statusEl.textContent = '🔄 Syncing data...';
    statusEl.style.background = '#3d6b4f';
    statusEl.style.display = 'block';
  } else if (event.data && event.data.type === 'SYNC_COMPLETE') {
    statusEl.textContent = '✅ All data synced';
    statusEl.style.background = '#2e8b57';
    setTimeout(() => {
      statusEl.style.display = 'none';
    }, 3000);
  }
});

// Example: Trigger sync when online
window.addEventListener('online', () => {
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({type: 'REQUEST_SYNC'});
  }
});
</script>
</body>
</html>
